<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#FFFFFF" />
    <title
      id="ui-listener-document-title"
      data-i18n="ui-listener-document-title"
      data-i18n-state="listener.title"
    >
      Champolu
    </title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="./assets/css/app.css" />
    <script type="module" src="./assets/js/listener.js"></script>
  </head>
  <body data-page="listener">
    <a
      class="skip button"
      href="#main"
      data-i18n="ui-listener-skip"
      id="ui-listener-skip"
      data-i18n-state="skip"
    ></a>
    <header class="header">
      <div class="shell header-inner">
        <a
          class="brand"
          href="./index.html"
          data-i18n-aria-label="ui-listener-brand"
          id="ui-listener-brand"
          data-i18n-state="brand"
          ><img
            class="brand-logo"
            src="./assets/images/champolu-logo.png"
            width="120"
            height="104"
            alt=""
            aria-hidden="true" /><span
            ><span
              class="brand-context"
              data-i18n="ui-listener-brand-context"
              id="ui-listener-brand-context"
              data-i18n-state="brand.context"
            ></span></span
        ></a>
        <nav
          class="nav"
          data-i18n-aria-label="ui-listener-nav-label"
          id="ui-listener-nav-label"
          data-i18n-state="nav.label"
        >
          <a
            href="./index.html"
            data-i18n="ui-listener-nav-projects"
            id="ui-listener-nav-projects"
            data-i18n-state="nav.projects"
          ></a>
        </nav>
      </div>
    </header>
    <main id="main" class="shell page">
      <div class="task-layout">
        <aside class="task-guide">
          <div class="guide-icon">
            <svg
              class=""
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M4 14v-3a8 8 0 0 1 16 0v3M4 12h3v8H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2Zm16 0h-3v8h3a2 2 0 0 0 2-2v-4a2 2 0 0 0-2-2Z"
              />
            </svg>
          </div>
          <h2
            class=""
            data-i18n="ui-listener-listener-guideTitle"
            id="ui-listener-listener-guideTitle"
            data-i18n-state="listener.guideTitle"
          ></h2>
          <p
            class="intro"
            data-i18n="ui-listener-listener-guideIntro"
            id="ui-listener-listener-guideIntro"
            data-i18n-state="listener.guideIntro"
          ></p>
          <ul class="guide-list">
            <li>
              <svg
                class=""
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="m5 12 4 4L19 6" /></svg
              ><span
                class=""
                data-i18n="ui-listener-listener-guideMode"
                id="ui-listener-listener-guideMode"
                data-i18n-state="listener.guideMode"
              ></span>
            </li>
            <li>
              <svg
                class=""
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="m5 12 4 4L19 6" /></svg
              ><span
                class=""
                data-i18n="ui-listener-listener-guideChoice"
                id="ui-listener-listener-guideChoice"
                data-i18n-state="listener.guideChoice"
              ></span>
            </li>
            <li>
              <svg
                class=""
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="m5 12 4 4L19 6" /></svg
              ><span
                class=""
                data-i18n="ui-listener-listener-guideSave"
                id="ui-listener-listener-guideSave"
                data-i18n-state="listener.guideSave"
              ></span>
            </li>
          </ul>
        </aside>
        <div class="task-main">
          <div class="task-heading">
            <h1
              class=""
              data-i18n="ui-listener-listener-title"
              id="ui-listener-listener-title"
              data-i18n-state="listener.title"
            ></h1>
            <p id="study-title" class="intro"></p>
          </div>
          <aside id="demo-notice" class="notice">
            <strong
              data-i18n="ui-listener-listener-demo"
              id="ui-listener-listener-demo"
              data-i18n-state="listener.demo"
            ></strong>
            <p
              data-i18n="ui-listener-listener-demoHelp"
              id="ui-listener-listener-demoHelp"
              data-i18n-state="listener.demoHelp"
            ></p>
          </aside>
          <p id="page-error" class="error" hidden></p>
          <div id="listener-start" class="panel controls" hidden>
            <button
              id="resume"
              class="button secondary"
              data-i18n="resume"
              data-i18n-state="listener.resume"
            ></button
            ><button
              id="new-session"
              class="button"
              data-i18n="new-session"
              data-i18n-state="listener.new"
            ></button>
          </div>
          <form id="question-panel" class="panel" hidden novalidate>
            <div class="progress-heading numbers">
              <p id="question-position"></p>
              <p id="answer-progress"></p>
            </div>
            <progress id="listener-progress" max="1" value="0"></progress>
            <p id="question-instructions" class="task-instruction"></p>
            <div id="audio-panel" class="audio-panel" hidden>
              <audio id="question-audio" preload="none"></audio>
              <div class="controls">
                <button
                  id="play-audio"
                  class="button secondary"
                  type="button"
                  data-i18n="play-audio"
                  data-i18n-state="audio.play"
                ></button
                ><span
                  id="audio-time"
                  class="numbers text-sm"
                  aria-live="off"
                ></span>
              </div>
              <p id="audio-status" class="status mt-2" role="status"></p>
              <button
                id="retry-audio"
                class="button secondary mt-2"
                type="button"
                hidden
                data-i18n="retry-audio"
                data-i18n-state="audio.retry"
              ></button>
            </div>
            <p id="question-sentence" class="sentence" hidden></p>
            <fieldset id="answer-group" aria-describedby="page-error">
              <legend id="question-prompt" class="question-prompt"></legend>
              <div id="answer-options"></div>
            </fieldset>
            <button
              id="submit-answer"
              class="button mt-4"
              type="submit"
              data-i18n="submit-answer"
              data-i18n-state="listener.submit"
            ></button>
            <p id="answer-status" class="status mt-4" role="status"></p>
          </form>
          <section id="completion" class="panel completion-panel" hidden>
            <span id="completion-symbol" class="check" aria-hidden="true"
              >✓</span
            >
            <h2
              id="completion-heading"
              data-i18n="completion-heading"
              data-i18n-state="listener.complete"
            ></h2>
            <p id="completion-summary" class="mt-4"></p>
            <p
              id="completion-detail"
              class="helper"
              data-i18n="completion-detail"
              data-i18n-state="completion.detail"
            ></p>
            <a
              href="./index.html"
              class="button secondary mt-8"
              data-i18n="ui-listener-back"
              id="ui-listener-back"
              data-i18n-state="back"
            ></a>
          </section>
          <p
            id="page-status"
            class="status mt-4"
            role="status"
            data-i18n="page-status"
            data-i18n-state="loading"
          ></p>
          <button
            id="retry-page"
            class="button secondary"
            hidden
            data-i18n="retry-page"
            data-i18n-state="retry"
          ></button>
          <aside class="storage-notice">
            <svg
              class=""
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="3" y="4" width="18" height="16" rx="3" />
              <path d="M7 8h10M7 12h10M7 16h3" />
            </svg>
            <div>
              <strong id="storage-notice"></strong>
              <p id="storage-detail"></p>
            </div>
          </aside>
        </div>
      </div>
    </main>
  </body>
</html>
