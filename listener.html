<!doctype html>
<html lang="zh-Hans" translate="no">
  <head>
    <meta charset="utf-8" />
    <meta name="google" content="notranslate" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#FFFFFF" />
    <title
      id="ui-listener-document-title"
      data-i18n="ui-listener-document-title"
      data-i18n-state="listener.title"
    >
      Speech research
    </title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="./assets/css/app.css" />
    <script type="module" src="./assets/js/listener.js"></script>
  </head>
  <body data-page="listener">
    <a
      class="skip button"
      href="#main"
      data-i18n="ui-listener-skip"
      id="ui-listener-skip"
      data-i18n-state="skip"
    ></a>
    <header class="header">
      <div class="shell header-inner">
        <a
          class="home-link"
          href="./index.html"
          data-i18n-aria-label="ui-listener-home"
          id="ui-listener-home"
          aria-label="ARBSQ 首页"
          ><img
            class="home-logo"
            src="./assets/images/arbsq-logo.png"
            width="175"
            height="250"
            alt=""
            aria-hidden="true"
        /></a>
        <div class="header-actions">
          <nav
            class="nav"
            data-i18n-aria-label="ui-listener-nav-label"
            id="ui-listener-nav-label"
            data-i18n-state="nav.label"
          >
            <a
              href="./index.html"
              data-i18n="ui-listener-nav-projects"
              id="ui-listener-nav-projects"
              data-i18n-state="nav.projects"
            ></a>
          </nav>
          <select
            id="interface-language"
            class="language-select"
            data-i18n-aria-label="interface-language"
            data-i18n-state="language.label"
            aria-label="界面语言"
          >
            <option
              id="ui-language-chinese"
              value="zh-Hans"
              data-i18n="ui-language-chinese"
            >
              中文
            </option>
            <option
              id="ui-language-english"
              value="en"
              data-i18n="ui-language-english"
            >
              English
            </option>
          </select>
          <button
            id="menu-toggle"
            class="menu-toggle"
            type="button"
            aria-controls="mobile-menu"
            aria-expanded="false"
            aria-haspopup="dialog"
            data-i18n-aria-label="menu-toggle"
            aria-label="打开导航菜单"
          >
            <span class="menu-icon" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </header>
    <main id="main" class="shell page listener-page">
      <div class="listener-layout">
        <div class="task-main">
          <div class="task-heading">
            <h1
              class=""
              data-i18n="ui-listener-listener-title"
              id="ui-listener-listener-title"
              data-i18n-state="listener.title"
            ></h1>
            <p id="study-title" class="intro"></p>
          </div>
          <aside id="demo-notice" class="notice">
            <strong
              data-i18n="ui-listener-listener-demo"
              id="ui-listener-listener-demo"
              data-i18n-state="listener.demo"
            ></strong>
            <p
              data-i18n="ui-listener-listener-demoHelp"
              id="ui-listener-listener-demoHelp"
              data-i18n-state="listener.demoHelp"
            ></p>
          </aside>
          <p id="page-error" class="error" hidden></p>
          <section
            id="listener-start"
            class="panel listener-session"
            aria-labelledby="listener-session-heading"
            hidden
          >
            <div class="listener-session-summary">
              <h2
                id="listener-session-heading"
                data-i18n="listener-session-heading"
                data-i18n-state="listener.startTitle"
              ></h2>
              <p
                id="listener-session-description"
                data-i18n="listener-session-description"
                data-i18n-state="listener.startHelp"
              ></p>
            </div>
            <div class="listener-session-actions">
              <button
                id="resume"
                class="button"
                data-i18n="resume"
                data-i18n-state="listener.resume"
              ></button
              ><button
                id="new-session"
                class="button secondary"
                data-i18n="new-session"
                data-i18n-state="listener.new"
              ></button>
            </div>
          </section>
          <form id="question-panel" class="panel" hidden novalidate>
            <div class="progress-heading numbers">
              <p id="question-position"></p>
              <p id="answer-progress"></p>
            </div>
            <progress id="listener-progress" max="1" value="0"></progress>
            <p id="question-instructions" class="task-instruction"></p>
            <div id="audio-panel" class="audio-panel" hidden>
              <audio id="question-audio" preload="none"></audio>
              <div class="controls">
                <button
                  id="play-audio"
                  class="button secondary"
                  type="button"
                  data-i18n="play-audio"
                  data-i18n-state="audio.play"
                ></button
                ><span
                  id="audio-time"
                  class="numbers text-sm"
                  aria-live="off"
                ></span>
              </div>
              <p id="audio-status" class="status mt-2" role="status"></p>
              <button
                id="retry-audio"
                class="button secondary mt-2"
                type="button"
                hidden
                data-i18n="retry-audio"
                data-i18n-state="audio.retry"
              ></button>
            </div>
            <p id="question-sentence" class="sentence" hidden></p>
            <fieldset id="answer-group" aria-describedby="page-error">
              <legend id="question-prompt" class="question-prompt"></legend>
              <div id="answer-options"></div>
            </fieldset>
            <button
              id="submit-answer"
              class="button mt-4"
              type="submit"
              data-i18n="submit-answer"
              data-i18n-state="listener.submit"
            ></button>
            <p id="answer-status" class="status mt-4" role="status"></p>
          </form>
          <section id="completion" class="panel completion-panel" hidden>
            <span id="completion-symbol" class="check" aria-hidden="true"
              >✓</span
            >
            <h2
              id="completion-heading"
              data-i18n="completion-heading"
              data-i18n-state="listener.complete"
            ></h2>
            <p id="completion-summary" class="mt-4"></p>
            <p
              id="completion-detail"
              class="helper"
              data-i18n="completion-detail"
              data-i18n-state="completion.detail"
            ></p>
            <a
              href="./index.html"
              class="button secondary mt-8"
              data-i18n="ui-listener-back"
              id="ui-listener-back"
              data-i18n-state="back"
            ></a>
          </section>
          <p
            id="page-status"
            class="status mt-4"
            role="status"
            data-i18n="page-status"
            data-i18n-state="loading"
          ></p>
          <button
            id="retry-page"
            class="button secondary"
            hidden
            data-i18n="retry-page"
            data-i18n-state="retry"
          ></button>
          <details class="listener-guide">
            <summary
              class=""
              data-i18n="ui-listener-listener-guideTitle"
              id="ui-listener-listener-guideTitle"
              data-i18n-state="listener.guideTitle"
            ></summary>
            <p
              class="intro"
              data-i18n="ui-listener-listener-guideIntro"
              id="ui-listener-listener-guideIntro"
              data-i18n-state="listener.guideIntro"
            ></p>
            <ul class="guide-list">
              <li>
                <span
                  class=""
                  data-i18n="ui-listener-listener-guideMode"
                  id="ui-listener-listener-guideMode"
                  data-i18n-state="listener.guideMode"
                ></span>
              </li>
              <li>
                <span
                  class=""
                  data-i18n="ui-listener-listener-guideChoice"
                  id="ui-listener-listener-guideChoice"
                  data-i18n-state="listener.guideChoice"
                ></span>
              </li>
              <li>
                <span
                  class=""
                  data-i18n="ui-listener-listener-guideSave"
                  id="ui-listener-listener-guideSave"
                  data-i18n-state="listener.guideSave"
                ></span>
              </li>
            </ul>
          </details>
          <aside class="storage-notice">
            <div>
              <strong id="storage-notice"></strong>
              <p id="storage-detail"></p>
            </div>
          </aside>
        </div>
      </div>
    </main>
    <footer class="site-footer">
      <div class="shell">
        <p
          id="footer-copyright"
          data-i18n="footer-copyright"
          data-i18n-state="footer.copyright"
        >
          ARBSQ · 2026
        </p>
      </div>
    </footer>
    <dialog
      id="mobile-menu"
      class="mobile-menu"
      aria-labelledby="mobile-menu-title"
    >
      <div class="mobile-menu-heading">
        <h2 id="mobile-menu-title" data-i18n="mobile-menu-title"></h2>
        <button
          id="menu-close"
          class="menu-close"
          type="button"
          data-i18n-aria-label="menu-close"
          aria-label="关闭导航菜单"
          autofocus
        >
          <span class="close-icon" aria-hidden="true"></span>
        </button>
      </div>
      <div class="mobile-menu-links"></div>
    </dialog>
  </body>
</html>
