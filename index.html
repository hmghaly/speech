<!doctype html>
<html lang="zh-Hans" translate="no">
  <head>
    <meta charset="utf-8" />
    <meta name="google" content="notranslate" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#FFFFFF" />
    <title
      id="ui-projects-document-title"
      data-i18n="ui-projects-document-title"
      data-i18n-state="projects.title"
    >
      Speech research
    </title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="./assets/css/app.css" />
    <script type="module" src="./assets/js/index.js"></script>
  </head>
  <body data-page="projects">
    <a
      class="skip button"
      href="#main"
      data-i18n="ui-index-skip"
      id="ui-index-skip"
      data-i18n-state="skip"
    ></a>
    <header class="header">
      <div class="shell header-inner">
        <a
          class="home-link"
          href="./index.html"
          data-i18n-aria-label="ui-index-home"
          id="ui-index-home"
          aria-label="ARBSQ 首页"
          ><img
            class="home-logo"
            src="./assets/images/arbsq-logo.png"
            width="175"
            height="250"
            alt=""
            aria-hidden="true"
        /></a>
        <div class="header-actions">
          <nav
            class="nav"
            data-i18n-aria-label="ui-index-nav-label"
            id="ui-index-nav-label"
            data-i18n-state="nav.label"
          >
            <a
              href="./index.html"
              aria-current="page"
              data-i18n="ui-index-nav-projects"
              id="ui-index-nav-projects"
              data-i18n-state="nav.projects"
            ></a
            ><a
              href="./project.html"
              data-i18n="ui-index-nav-create"
              id="ui-index-nav-create"
              data-i18n-state="nav.create"
            ></a
            ><a
              href="./listener.html?study=sample"
              data-i18n="ui-index-nav-listener"
              id="ui-index-nav-listener"
              data-i18n-state="nav.listener"
            ></a>
          </nav>
          <select
            id="interface-language"
            class="language-select"
            data-i18n-aria-label="interface-language"
            data-i18n-state="language.label"
            aria-label="界面语言"
          >
            <option
              id="ui-language-chinese"
              value="zh-Hans"
              data-i18n="ui-language-chinese"
            >
              中文
            </option>
            <option
              id="ui-language-english"
              value="en"
              data-i18n="ui-language-english"
            >
              English
            </option>
          </select>
          <button
            id="menu-toggle"
            class="menu-toggle"
            type="button"
            aria-controls="mobile-menu"
            aria-expanded="false"
            aria-haspopup="dialog"
            data-i18n-aria-label="menu-toggle"
            aria-label="打开导航菜单"
          >
            <span class="menu-icon" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </header>
    <main id="main" class="home-page">
      <section class="hero">
        <div class="shell hero-copy">
          <h1
            class=""
            data-i18n="ui-index-projects-heroHeadline"
            id="ui-index-projects-heroHeadline"
            data-i18n-state="projects.heroHeadline"
          ></h1>
          <p
            class="intro"
            data-i18n="ui-index-projects-intro"
            id="ui-index-projects-intro"
            data-i18n-state="projects.intro"
          ></p>
          <div class="hero-actions">
            <a
              class="button"
              href="./project.html"
              data-i18n="ui-index-nav-create-2"
              id="ui-index-nav-create-2"
              data-i18n-state="nav.create"
            ></a
            ><a
              class="button secondary"
              href="./listener.html?study=sample"
              data-i18n="ui-index-nav-listener-2"
              id="ui-index-nav-listener-2"
              data-i18n-state="nav.listener"
            ></a>
          </div>
        </div>
      </section>
      <div class="shell project-library">
        <section class="projects-card" aria-labelledby="ui-index-projects-list">
          <div class="section-heading">
            <h2
              class=""
              data-i18n="ui-index-projects-list"
              id="ui-index-projects-list"
              data-i18n-state="projects.list"
            ></h2>
            <p
              class=""
              data-i18n="ui-index-projects-libraryHelp"
              id="ui-index-projects-libraryHelp"
              data-i18n-state="projects.libraryHelp"
            ></p>
          </div>
          <div class="library">
            <div
              id="projects-list"
              class="projects-scroll"
              role="region"
              aria-labelledby="ui-index-projects-list"
              tabindex="0"
            ></div>
            <div class="library-feedback">
              <p
                id="page-status"
                class="status"
                role="status"
                data-i18n="page-status"
                data-i18n-state="loading"
              ></p>
              <p id="page-error" class="error" hidden></p>
              <button
                id="reload"
                class="button secondary"
                hidden
                data-i18n="reload"
                data-i18n-state="retry"
              ></button>
            </div>
          </div>
        </section>
        <p
          id="local-link-note"
          class="helper mt-4"
          data-i18n="local-link-note"
          data-i18n-state="local.link"
        ></p>
        <aside class="storage-notice">
          <div>
            <strong id="storage-notice"></strong>
            <p id="storage-detail"></p>
          </div>
        </aside>
      </div>
    </main>
    <footer class="site-footer">
      <div class="shell">
        <p
          id="footer-copyright"
          data-i18n="footer-copyright"
          data-i18n-state="footer.copyright"
        >
          ARBSQ · 2026
        </p>
      </div>
    </footer>
    <dialog
      id="mobile-menu"
      class="mobile-menu"
      aria-labelledby="mobile-menu-title"
    >
      <div class="mobile-menu-heading">
        <h2 id="mobile-menu-title" data-i18n="mobile-menu-title"></h2>
        <button
          id="menu-close"
          class="menu-close"
          type="button"
          data-i18n-aria-label="menu-close"
          aria-label="关闭导航菜单"
          autofocus
        >
          <span class="close-icon" aria-hidden="true"></span>
        </button>
      </div>
      <div class="mobile-menu-links"></div>
    </dialog>
  </body>
</html>
