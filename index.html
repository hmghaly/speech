<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#FFFFFF" />
    <title
      id="ui-projects-document-title"
      data-i18n="ui-projects-document-title"
      data-i18n-state="projects.title"
    >
      Champolu
    </title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="./assets/css/app.css" />
    <script type="module" src="./assets/js/index.js"></script>
  </head>
  <body data-page="projects">
    <a
      class="skip button"
      href="#main"
      data-i18n="ui-index-skip"
      id="ui-index-skip"
      data-i18n-state="skip"
    ></a>
    <header class="header">
      <div class="shell header-inner">
        <a
          class="brand"
          href="./index.html"
          data-i18n-aria-label="ui-index-brand"
          id="ui-index-brand"
          data-i18n-state="brand"
          ><img
            class="brand-logo"
            src="./assets/images/champolu-logo.png"
            width="120"
            height="104"
            alt=""
            aria-hidden="true" /><span
            ><span
              class="brand-context"
              data-i18n="ui-index-brand-context"
              id="ui-index-brand-context"
              data-i18n-state="brand.context"
            ></span></span
        ></a>
        <nav
          class="nav"
          data-i18n-aria-label="ui-index-nav-label"
          id="ui-index-nav-label"
          data-i18n-state="nav.label"
        >
          <a
            href="./index.html"
            aria-current="page"
            data-i18n="ui-index-nav-projects"
            id="ui-index-nav-projects"
            data-i18n-state="nav.projects"
          ></a
          ><a
            href="./project.html"
            data-i18n="ui-index-nav-create"
            id="ui-index-nav-create"
            data-i18n-state="nav.create"
          ></a
          ><a
            href="./listener.html?study=demo"
            data-i18n="ui-index-nav-listener"
            id="ui-index-nav-listener"
            data-i18n-state="nav.listener"
          ></a>
        </nav>
      </div>
    </header>
    <main id="main" class="shell page">
      <section class="hero">
        <div class="hero-copy">
          <h1
            class=""
            data-i18n="ui-index-projects-heroHeadline"
            id="ui-index-projects-heroHeadline"
            data-i18n-state="projects.heroHeadline"
          ></h1>
          <p
            class="intro"
            data-i18n="ui-index-projects-intro"
            id="ui-index-projects-intro"
            data-i18n-state="projects.intro"
          ></p>
          <div class="hero-actions">
            <a
              class="button"
              href="./project.html"
              data-i18n="ui-index-nav-create-2"
              id="ui-index-nav-create-2"
              data-i18n-state="nav.create"
            ></a
            ><a
              class="button secondary"
              href="./listener.html?study=demo"
              data-i18n="ui-index-nav-listener-2"
              id="ui-index-nav-listener-2"
              data-i18n-state="nav.listener"
            ></a>
          </div>
        </div>
        <div class="signal" aria-hidden="true">
          <svg
            viewBox="0 0 448 188"
            fill="none"
            stroke="currentColor"
            stroke-width="5"
            stroke-linecap="round"
          >
            <path d="M4 94h24m392 0h24" stroke="#987C5F" stroke-width="2" />
            <path d="M42 89.0v10" />
            <path d="M54 84.0v20" />
            <path d="M66 88.0v12" />
            <path d="M78 76.0v36" />
            <path d="M90 67.0v54" />
            <path d="M102 79.0v30" />
            <path d="M114 59.0v70" />
            <path d="M126 44.0v100" />
            <path d="M138 28.0v132" />
            <path d="M150 38.0v112" />
            <path d="M162 63.0v62" />
            <path d="M174 49.0v90" />
            <path d="M186 22.0v144" />
            <path d="M198 10.0v168" />
            <path d="M210 34.0v120" />
            <path d="M222 55.0v78" />
            <path d="M234 43.0v102" />
            <path d="M246 19.0v150" />
            <path d="M258 30.0v128" />
            <path d="M270 48.0v92" />
            <path d="M282 68.0v52" />
            <path d="M294 54.0v80" />
            <path d="M306 34.0v120" />
            <path d="M318 47.0v94" />
            <path d="M330 64.0v60" />
            <path d="M342 81.0v26" />
            <path d="M354 72.0v44" />
            <path d="M366 85.0v18" />
            <path d="M378 80.0v28" />
            <path d="M390 89.0v10" />
          </svg>
          <div class="signal-caption">
            <span
              class=""
              data-i18n="ui-index-projects-signalRead"
              id="ui-index-projects-signalRead"
              data-i18n-state="projects.signalRead"
            ></span
            ><span
              class=""
              data-i18n="ui-index-projects-signalListen"
              id="ui-index-projects-signalListen"
              data-i18n-state="projects.signalListen"
            ></span>
          </div>
        </div>
      </section>
      <section>
        <div class="section-heading">
          <h2
            class=""
            data-i18n="ui-index-projects-list"
            id="ui-index-projects-list"
            data-i18n-state="projects.list"
          ></h2>
          <p
            class=""
            data-i18n="ui-index-projects-libraryHelp"
            id="ui-index-projects-libraryHelp"
            data-i18n-state="projects.libraryHelp"
          ></p>
        </div>
        <div class="library">
          <div id="projects-list"></div>
          <p
            id="page-status"
            class="status"
            role="status"
            data-i18n="page-status"
            data-i18n-state="loading"
          ></p>
          <p id="page-error" class="error" hidden></p>
          <button
            id="reload"
            class="button secondary"
            hidden
            data-i18n="reload"
            data-i18n-state="retry"
          ></button>
        </div>
        <p
          id="local-link-note"
          class="helper mt-4"
          data-i18n="local-link-note"
          data-i18n-state="local.link"
        ></p>
      </section>
      <aside class="storage-notice">
        <svg
          class=""
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect x="3" y="4" width="18" height="16" rx="3" />
          <path d="M7 8h10M7 12h10M7 16h3" />
        </svg>
        <div>
          <strong id="storage-notice"></strong>
          <p id="storage-detail"></p>
        </div>
      </aside>
    </main>
  </body>
</html>
